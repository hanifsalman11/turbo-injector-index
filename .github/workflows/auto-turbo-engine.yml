name: Autonomous Turbo Airflow & Fuel Injector Sizing Engine

on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_turbo:
        description: 'Optional Engine, Turbo, or Injector Setup (e.g. 5.3L LS Turbo 700 HP E85 or Garrett GT3582R)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-turbo-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Turbo & Injector Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_TURBO: ${{ github.event.inputs.custom_turbo || '' }}
        run: |
          python engine/turbo_builder.py

      - name: Self-Healing Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_turbos.json
          if git diff --staged --quiet; then
            echo "No new turbo & injector calculator pages to commit."
          else
            git commit -m "chore(turbo): auto-publish new turbo airflow, fuel injector & LPH pump calculators"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              if git push origin main; then
                echo "Pushed successfully on attempt $i"
                break
              fi
              sleep 5
            done
          fi
